name: Publish predictions board

on:
  # Runs right after the daily loop commits new predictions
  workflow_run:
    workflows: ["Daily prediction loop"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: predictions-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # workflow_run checks out the default SHA; we want the daily commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e .

      - name: Render prediction board
        run: lottery-guru board

      - name: Commit board
        run: |
          git config user.name "lottery-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PREDICTIONS.md README.md
          if git diff --cached --quiet; then
            echo "Board already up to date"
          else
            git commit -m "Update predictions board: $(date -u +%F)"
            git pull --rebase --autostash
            git push
          fi
