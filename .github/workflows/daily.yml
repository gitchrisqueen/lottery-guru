name: Daily prediction loop

on:
  schedule:
    # 10:15 UTC — after NY Open Data's nightly batch (~07:30-09:00 UTC) lands
    - cron: "15 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-loop
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[llm]"

      # The tuned arm needs an on-demand GPU deployment (Fireworks does not
      # serve LoRA fine-tunes serverlessly). It is brought up for the daily
      # predictions and torn down below — never left running.
      # Best-effort: a failure here is visible but must not block the loop.
      - name: Bring up the tuned model
        id: deploy
        continue-on-error: true
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_ACCOUNT_ID: ${{ secrets.FIREWORKS_ACCOUNT_ID }}
        run: lottery-guru finetune deploy --only-if-drawings

      - name: Pull results, score, predict, report
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_ACCOUNT_ID: ${{ secrets.FIREWORKS_ACCOUNT_ID }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: lottery-guru daily

      # always() — a leaked deployment bills GPU time indefinitely, so this
      # runs even if the loop above fails or the job is cancelled.
      - name: Tear down the tuned model
        if: always()
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          FIREWORKS_ACCOUNT_ID: ${{ secrets.FIREWORKS_ACCOUNT_ID }}
        run: lottery-guru finetune teardown

      - name: Commit results
        if: always()
        run: |
          git config user.name "lottery-guru-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ REPORT.md PREDICTIONS.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily loop: $(date -u +%F)"
            git push
          fi
