[project]
name = "lottery-guru"
version = "0.1.0"
description = "Pulls lottery drawings daily, generates predictions from a portfolio of strategies, and rigorously measures whether anything beats chance (spoiler: it shouldn't)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
lottery-guru = "lottery_guru.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lottery_guru"]

[tool.pytest.ini_options]
testpaths = ["tests"]
